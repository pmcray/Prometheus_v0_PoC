name: Documentation

on:
  push:
    branches: [ main, v0.69 ]
    paths:
      - 'prometheus/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints

    - name: Build API documentation
      run: |
        cd docs
        make html || echo "Sphinx docs not yet configured"

    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        cname: docs.prometheus-ai.org

  validate-notebooks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbformat nbconvert jupyter

    - name: Validate notebook format
      run: |
        for notebook in notebooks/*.ipynb; do
          jupyter nbconvert --to notebook --execute --inplace "$notebook" --ExecutePreprocessor.timeout=60 || true
        done

    - name: Check for output cells
      run: |
        python -c "
        import nbformat
        import sys
        from pathlib import Path

        for notebook_path in Path('notebooks').glob('*.ipynb'):
            nb = nbformat.read(notebook_path, as_version=4)
            has_output = any(cell.get('outputs') or cell.get('execution_count')
                           for cell in nb.cells if cell.cell_type == 'code')
            if has_output:
                print(f'Warning: {notebook_path} has output cells')
        "
