name: Test Notebooks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'notebooks/**'
      - '.github/workflows/test-notebooks.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'notebooks/**'
  workflow_dispatch:

jobs:
  validate-notebooks:
    name: Validate Notebook Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbformat nbconvert

      - name: Validate JSON structure
        run: |
          python -c "
          import json
          from pathlib import Path

          notebooks = list(Path('notebooks').glob('*.ipynb'))
          errors = []

          for nb_path in notebooks:
              try:
                  with open(nb_path) as f:
                      nb = json.load(f)

                  # Check notebook format version
                  if 'nbformat' not in nb:
                      errors.append(f'{nb_path.name}: Missing nbformat')

                  # Check for cells
                  if 'cells' not in nb or len(nb['cells']) == 0:
                      errors.append(f'{nb_path.name}: No cells found')

                  print(f'✓ {nb_path.name}: {len(nb[\"cells\"])} cells')

              except json.JSONDecodeError as e:
                  errors.append(f'{nb_path.name}: Invalid JSON - {e}')
              except Exception as e:
                  errors.append(f'{nb_path.name}: Error - {e}')

          if errors:
              print('\\nErrors found:')
              for error in errors:
                  print(f'✗ {error}')
              exit(1)
          else:
              print(f'\\n✓ All {len(notebooks)} notebooks are valid')
          "

      - name: Check for execution outputs
        run: |
          python -c "
          import json
          from pathlib import Path

          notebooks = list(Path('notebooks').glob('*.ipynb'))

          for nb_path in notebooks:
              with open(nb_path) as f:
                  nb = json.load(f)

              has_outputs = any(
                  'outputs' in cell and len(cell['outputs']) > 0
                  for cell in nb['cells']
                  if cell['cell_type'] == 'code'
              )

              if has_outputs:
                  print(f'✓ {nb_path.name}: Contains execution outputs')
              else:
                  print(f'⚠ {nb_path.name}: No execution outputs (may need to run)')
          "

  check-colab-compatibility:
    name: Check Colab Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbformat

      - name: Check for Colab-specific features
        run: |
          python -c "
          import json
          from pathlib import Path

          notebooks = list(Path('notebooks').glob('*.ipynb'))

          for nb_path in notebooks:
              with open(nb_path) as f:
                  nb = json.load(f)

              # Check metadata
              colab_meta = nb.get('metadata', {}).get('colab', {})

              if colab_meta:
                  print(f'✓ {nb_path.name}: Has Colab metadata')
                  if 'provenance' in colab_meta:
                      print(f'  - Has provenance info')
                  if 'gpuType' in colab_meta:
                      print(f'  - GPU type: {colab_meta[\"gpuType\"]}')
              else:
                  print(f'⚠ {nb_path.name}: No Colab metadata')

              # Check for Colab-specific cells
              for i, cell in enumerate(nb['cells']):
                  if cell['cell_type'] == 'code':
                      source = ''.join(cell.get('source', []))

                      # Check for common Colab patterns
                      if 'from google.colab import' in source:
                          print(f'  - Cell {i}: Uses google.colab')
                      if '!pip install' in source:
                          print(f'  - Cell {i}: Installs packages')
                      if 'drive.mount' in source:
                          print(f'  - Cell {i}: Mounts Google Drive')
          "

  test-quick-execution:
    name: Quick Execution Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert ipykernel

      - name: Install package
        run: |
          pip install -e .

      - name: Test import cells (dry run)
        run: |
          python -c "
          import json
          from pathlib import Path

          notebooks = list(Path('notebooks').glob('*.ipynb'))

          for nb_path in notebooks:
              with open(nb_path) as f:
                  nb = json.load(f)

              print(f'\\nAnalyzing {nb_path.name}:')

              # Find and check import cells
              import_cells = []
              for i, cell in enumerate(nb['cells']):
                  if cell['cell_type'] == 'code':
                      source = ''.join(cell.get('source', []))
                      if 'import' in source and not source.strip().startswith('#'):
                          import_cells.append(i)

              print(f'  Found {len(import_cells)} code cells with imports')

              # Check for training/demo mode flags
              has_quick_mode = any(
                  'QUICK_DEMO' in ''.join(cell.get('source', [])) or
                  'quick_mode' in ''.join(cell.get('source', []))
                  for cell in nb['cells']
              )

              if has_quick_mode:
                  print(f'  ✓ Has quick demo mode')
              else:
                  print(f'  ⚠ No quick demo mode found')
          "

  check-documentation:
    name: Check Notebook Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check notebook documentation
        run: |
          python -c "
          import json
          from pathlib import Path

          notebooks = list(Path('notebooks').glob('*.ipynb'))

          for nb_path in notebooks:
              with open(nb_path) as f:
                  nb = json.load(f)

              # Count markdown vs code cells
              markdown_cells = sum(1 for cell in nb['cells'] if cell['cell_type'] == 'markdown')
              code_cells = sum(1 for cell in nb['cells'] if cell['cell_type'] == 'code')

              # Check for title
              has_title = False
              if nb['cells'] and nb['cells'][0]['cell_type'] == 'markdown':
                  first_cell = ''.join(nb['cells'][0].get('source', []))
                  has_title = first_cell.startswith('#')

              print(f'{nb_path.name}:')
              print(f'  Markdown cells: {markdown_cells}')
              print(f'  Code cells: {code_cells}')
              print(f'  Has title: {\"✓\" if has_title else \"✗\"}')
              print(f'  Docs ratio: {markdown_cells/(markdown_cells+code_cells)*100:.1f}%')
          "

  summary:
    name: Notebook Tests Summary
    runs-on: ubuntu-latest
    needs: [validate-notebooks, check-colab-compatibility, test-quick-execution, check-documentation]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Notebook validation complete"
          echo "============================"
          echo "All notebook tests finished"
          echo "See individual jobs for details"
