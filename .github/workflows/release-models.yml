name: Release Models

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Model release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      models:
        description: 'Models to release (comma-separated: go_9x9,go_19x19,chess or "all")'
        required: true
        default: 'all'

jobs:
  prepare-release:
    name: Prepare Model Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if models exist
        run: |
          echo "Checking for model files..."
          if [ -f "models/pretrained/go_9x9.h5" ]; then
            echo "✓ go_9x9.h5 found"
          else
            echo "⚠ go_9x9.h5 not found"
          fi

          if [ -f "models/pretrained/go_19x19.h5" ]; then
            echo "✓ go_19x19.h5 found"
          else
            echo "⚠ go_19x19.h5 not found"
          fi

          if [ -f "models/pretrained/chess.h5" ]; then
            echo "✓ chess.h5 found"
          else
            echo "⚠ chess.h5 not found"
          fi

      - name: Verify models
        run: |
          python scripts/release_models.py --verify

      - name: Prepare release
        run: |
          python scripts/release_models.py --prepare

      - name: Generate release notes
        run: |
          python scripts/release_models.py --release-notes

      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-files
          path: |
            release/
            models/pretrained/*.h5
            models/pretrained/*.json

      - name: Display release instructions
        run: |
          python scripts/release_models.py --instructions

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: prepare-release
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-files

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: models-${{ github.event.inputs.version }}
          name: Pre-trained Models ${{ github.event.inputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            models/pretrained/go_9x9.h5
            models/pretrained/go_19x19.h5
            models/pretrained/chess.h5
            release/model_manifest.json
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release created
        run: |
          echo "✓ Release draft created successfully!"
          echo "Review and publish at: https://github.com/${{ github.repository }}/releases"
